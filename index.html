
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malam Berbintang</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(180deg, #020817, #10244b, #050b1b);
  font-family: Arial, sans-serif;
  color: white;
}

.sky {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 8px white;
  animation: twinkle 2s infinite alternate,
             float 8s infinite ease-in-out;
}

.moon {
  position: absolute;
  top: 7%;
  right: 10%;
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #fff1bd;
  box-shadow: 0 0 35px #fff1bd;
}

.moon::after {
  content: "";
  position: absolute;
  top: -8px;
  left: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #07142d;
}

.content {
  position: relative;
  z-index: 2;
  width: min(92%, 900px);
  text-align: center;
  padding: 25px 0;
}

h1 {
  font-size: clamp(22px, 4vw, 34px);
  margin-bottom: 25px;
  text-shadow: 0 0 12px #91baff;
}

.video {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  box-shadow: 0 0 25px #6c9fff55;
}

iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}

@keyframes twinkle {
  from {
    opacity: 0.2;
    transform: scale(0.7);
  }
  to {
    opacity: 1;
    transform: scale(1.5);
  }
}

@keyframes float {
  0% { translate: 0 0; }
  50% { translate: 18px -25px; }
  100% { translate: -10px 12px; }
}
</style>
</head>

<body>

<div class="sky" id="sky">
  <div class="moon"></div>
</div>

<main class="content">
  <h1>🌙 Malam Berbintang ⭐</h1>

  <div class="video">
    <iframe
      src="https://www.youtube-nocookie.com/embed/6FFESvSZHws"
      title="Video YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>
</main>

<script>
const sky = document.getElementById("sky");

for (let i = 0; i < 120; i++) {
  const star = document.createElement("div");
  star.className = "star";

  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 5 + "s";
  star.style.animationDuration =
    (2 + Math.random() * 7) + "s";

  const size = 1 + Math.random() * 3;
  star.style.width = size + "px";
  star.style.height = size + "px";

  sky.appendChild(star);
}
</script>

</body>
</html>
